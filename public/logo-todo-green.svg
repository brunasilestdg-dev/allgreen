<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="TO DO">
  <title>TO DO</title>
  <rect width="120" height="120" rx="14" fill="#0e3a26"/>
  <g fill="#ffffff">
    <!-- T (superior esquerdo): barra horizontal tombada + haste curta -->
    <g transform="rotate(-14 34 34)">
      <rect x="12" y="14" width="46" height="14" rx="2"/>
      <rect x="24" y="28" width="14" height="30" rx="2"/>
    </g>
    <!-- O (superior direito): círculo cheio -->
    <circle cx="90" cy="34" r="20"/>
    <!-- D (inferior esquerdo): semicírculo com o lado reto para cima -->
    <path d="M 14 68 H 58 A 22 22 0 0 1 14 68 Z"/>
    <!-- O (inferior direito): círculo cheio -->
    <circle cx="90" cy="86" r="20"/>
  </g>
</svg>
