cliArgs:
  geometry: false
  planmode: false
  threads: 4
  explore: 5
  limit: '25mb'
  logdir: '..'
  logsize: '100M'
  maxlocations: 10000
  maxvehicles: 250
  override: ['c', 'g', 'l', 't', 'x']
  path: ''
  port: 3000
  router: 'osrm'
  timeout: 30000
  baseurl: '/'

routingServers:
  osrm:
    car:
      host: 'osrm'
      port: '5000'
    bike:
      host: 'osrm'
      port: '5000'
    foot:
      host: 'osrm'
      port: '5000'
