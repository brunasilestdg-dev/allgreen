services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: ["osrm-routed", "--algorithm", "mld", "/data/sudeste-latest.osrm"]
    volumes:
      - ./data:/data:ro
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  nominatim:
    image: mediagis/nominatim:5.3.2
    environment:
      PBF_PATH: /nominatim/data/sudeste-latest.osm.pbf
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:?defina NOMINATIM_PASSWORD no arquivo .env}
      IMPORT_WIKIPEDIA: "false"
      THREADS: ${NOMINATIM_THREADS:-4}
      UPDATE_MODE: none
    volumes:
      - ./data/sudeste-latest.osm.pbf:/nominatim/data/sudeste-latest.osm.pbf:ro
      - nominatim-db:/var/lib/postgresql/16/main
      - nominatim-flatnode:/nominatim/flatnode
    ports:
      - "127.0.0.1:8080:8080"
    shm_size: 1gb
    restart: unless-stopped

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.15.0
    environment:
      VROOM_ROUTER: osrm
    volumes:
      - ./vroom-conf:/conf
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - osrm
    restart: unless-stopped

  # Valhalla: rota para PESADOS (truck costing: altura, largura, comprimento,
  # peso, eixos) e elevação (/height) a partir do MESMO extrato OSM. Os tiles
  # são construídos na primeira subida (demorado) e ficam no volume.
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    environment:
      tile_urls: ${TDG_OSM_PBF_URL:-https://download.geofabrik.de/south-america/brazil/sudeste-latest.osm.pbf}
      build_elevation: "True"
      build_admins: "True"
      build_time_zones: "True"
      serve_tiles: "True"
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
      server_threads: ${VALHALLA_THREADS:-2}
    volumes:
      - valhalla-tiles:/custom_files
    ports:
      - "127.0.0.1:8002:8002"
    restart: unless-stopped

  routing-gateway:
    image: nginx:alpine
    environment:
      ROUTING_TOKEN: ${ROUTING_TOKEN:?defina ROUTING_TOKEN no arquivo .env}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    ports:
      - "127.0.0.1:3100:8080"
    depends_on:
      - vroom
      - nominatim
      - valhalla
    restart: unless-stopped

volumes:
  nominatim-db:
  nominatim-flatnode:
  valhalla-tiles:
