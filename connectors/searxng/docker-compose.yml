# SearXNG do Seu Funcionário: sobe com um comando.
#
# Três contêineres, cada um com um motivo:
#
#   searxng  — o buscador. NÃO fica exposto na internet: publica só em
#              127.0.0.1, e quem fala com o mundo é o Caddy.
#   redis    — cache dos motores. Sem ele o SearXNG funciona, mas repete
#              consulta e apanha mais rápido do rate limit do Google.
#   caddy    — HTTPS automático e a porta que exige o token. É o que impede a
#              instância de virar proxy de busca gratuito para o mundo — o
#              caminho conhecido para o IP do servidor ser banido no Google,
#              matando o "sem cota" que motivou hospedar isto.
#
# Antes de subir, crie o arquivo `.env` ao lado deste (veja `.env.example`).

services:
  redis:
    image: valkey/valkey:8-alpine
    container_name: searxng-redis
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks: [searxng]
    volumes:
      - valkey-data:/data
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID, DAC_OVERRIDE]

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    networks: [searxng]
    # Só o Caddy alcança. Publicar 8080 na internet aqui anularia o token.
    expose:
      - "8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      # O Caddy termina o TLS; esta é a URL pública que o SearXNG anuncia.
      SEARXNG_BASE_URL: "https://${SEARXNG_HOSTNAME}/"
      SEARXNG_SECRET: "${SEARXNG_SECRET}"
      SEARXNG_REDIS_URL: "redis://redis:6379/0"
      # Repetido aqui porque a imagem lê a variável antes do settings.yml em
      # algumas versões, e uma das duas precisa vencer no sentido certo.
      SEARXNG_LIMITER: "false"
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "1" }

  caddy:
    image: caddy:2-alpine
    container_name: searxng-caddy
    restart: unless-stopped
    networks: [searxng]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      SEARXNG_HOSTNAME: "${SEARXNG_HOSTNAME}"
      SEARXNG_TOKEN: "${SEARXNG_TOKEN}"

networks:
  searxng:

volumes:
  valkey-data:
  caddy-data:
  caddy-config:
