name: Qualidade

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

# Um push novo cancela a verificação do anterior. Assim, commits substituídos
# não continuam consumindo runner sem necessidade.
concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci
        env:
          # Os navegadores são tratados no cache abaixo.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Lint (trava em erros; avisos não bloqueiam)
        run: npm run lint

      - name: Testes de interface e domínio
        run: npm run test:unit

      - name: Testes de worker
        run: npm run test:worker

      - name: Construir
        run: npm run build

      # O Chromium é grande e não precisa ser reinstalado em toda execução.
      # A chave muda quando package-lock.json muda, acompanhando a versão do
      # Playwright. Em cache hit, o passo de instalação é pulado por completo.
      - name: Cache do navegador do Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Instalar Chromium para o E2E
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 4
        run: timeout 180 npx playwright install chromium

      # Gate crítico de acesso continua obrigatório antes da publicação.
      - name: E2E de acesso à vertical (gate de produção)
        run: npm run test:e2e:acesso
        env:
          CI: true

      # Jornadas e layout continuam no gate. Não removemos cobertura para
      # economizar minutos; só eliminamos trabalho repetido e docs-only runs.
      - name: E2E das jornadas e do layout da To Do Green
        run: npm run test:e2e:todogreen
        env:
          CI: true
