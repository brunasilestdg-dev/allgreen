name: Publicar

# Fallback manual de publicação — e só depois do gate local completo.
#
# O CI/CD principal é o Cloudflare Workers Builds. Este workflow existe só como
# botão manual de emergência. Como o GitHub Actions pode ficar sem minutos/runner,
# ele não é a fonte única do quality gate; quando este botão for usado, ele próprio
# precisa instalar, validar, compilar e só então migrar/publicar.
#
# Só funciona depois que o segredo CLOUDFLARE_API_TOKEN existir no repositório
# (Settings > Secrets and variables > Actions). O passo abaixo confere isso
# primeiro e explica o que fazer, em vez de falhar com erro incompreensível.

on:
  # O CI/CD principal é o Cloudflare Workers Builds (publica em push na main;
  # ver docs/CLOUDFLARE_BUILDS_SETUP.md). Este fluxo é só o FALLBACK MANUAL —
  # para republicar sem depender do Builds. Não há gatilho automático, de
  # propósito: publicar pelo Actions e pelo Cloudflare ao mesmo tempo seria
  # PUBLICAÇÃO DUPLICADA. Este é o único workflow do repositório; não existe
  # um fluxo "Qualidade" no GitHub — o gate de qualidade roda antes do merge e
  # no próprio Workers Builds.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-producao
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Só publicação manual (workflow_dispatch). O gatilho automático foi
    # removido — quem publica automaticamente agora é o Cloudflare Workers
    # Builds. Este job é o botão de emergência.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - name: Conferir se a chave da Cloudflare está cadastrada
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta cadastrar o segredo CLOUDFLARE_API_TOKEN."
            echo ""
            echo "Como resolver, uma vez só:"
            echo "1. Entre em https://dash.cloudflare.com/profile/api-tokens"
            echo "2. Create Token > Edit Cloudflare Workers > Continue to summary > Create Token"
            echo "3. Copie o token (ele só aparece uma vez)"
            echo "4. No GitHub deste repositorio: Settings > Secrets and variables > Actions"
            echo "5. New repository secret, nome CLOUDFLARE_API_TOKEN, cole o token, Add secret"
            echo "6. Volte na aba Actions e mande rodar este fluxo de novo"
            exit 1
          fi
          echo "Chave encontrada."

      # Sem `ref`: o checkout usa o commit exato do disparo manual (`github.sha`
      # do branch escolhido em "Run workflow"). É esse commit que passa pelo
      # gate abaixo e é publicado — nada que tenha chegado depois do clique.
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar qualidade
        run: npm run verify

      - name: Construir o app
        run: npm run build

      - name: Instalar Chromium do gate crítico
        run: npx playwright install --with-deps chromium

      - name: Validar jornadas críticas no navegador
        run: npm run test:e2e:critical

      # A migração vem antes de publicar: código novo que espera coluna nova
      # não pode subir antes de a coluna existir.
      - name: Atualizar o banco
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply allgreen-db --remote

      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Conferir a versão que ficou no ar
        run: |
          sleep 15
          NO_AR=$(curl -s https://orianone.app/api/status | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
          ESPERADA=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/version.json', 'utf8')).version)")
          echo "No ar: $NO_AR | Esperada: $ESPERADA"
          if [ "$NO_AR" != "$ESPERADA" ]; then
            echo "::warning::O site respondeu $NO_AR e nao $ESPERADA. Pode ser cache; confira em alguns minutos."
          else
            echo "Publicado com sucesso: $NO_AR"
          fi
